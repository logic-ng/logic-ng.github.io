# the site
site_name: The Next Generation Logic Framework
site_url: https://www.logicng.org
site_description: LogicNG
site_author: BooleWorks GmbH

# the repository
repo_name: logic-ng/LogicNG
repo_url: https://github.com/logic-ng/LogicNG
edit_uri: ""

# Copyright
copyright: Copyright &copy; BooleWorks GmbH

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.annotate
    - navigation.tabs
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - announce.dismiss
  palette:
    - media: "(prefers-color-scheme)"
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
        primary: teal
        accent: teal
plugins:
  - search
  - social
  - blog

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/booleworks/
      name: BooleWorks on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/booleworks
      name: BooleWorks on LinkedIn

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: logic-ng
      repo: LogicNG
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.tilde
  - tables
  - footnotes
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
